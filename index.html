<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f46e5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z'/><path d='M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z'/><path d='M15 13h4.5a2 2 0 0 1 1.9 1.321L22 17.5'/><path d='M20 11h2'/><path d='M15 8.5h1.5a2 2 0 0 1 1.9 1.321L19 11.5'/><path d='M9 13H4.5a2 2 0 0 0-1.9 1.321L2 17.5'/><path d='M4 11H2'/><path d='M9 8.5H7.5a2 2 0 0 0-1.9 1.321L5 11.5'/></svg>">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon.svg">
    <title>OrganizaAI</title>
    <script>
      // Suppress benign Vite websocket errors in development
      const originalConsoleError = console.error;
      console.error = function(...args) {
        if (args[0] && typeof args[0] === 'string' && args[0].includes('[vite] failed to connect to websocket')) {
          return;
        }
        originalConsoleError.apply(console, args);
      };

      function clearSupabaseAndReload(error) {
        console.warn('Clearing Supabase session due to error:', error);
        const keysToRemove = [];
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key && (key.startsWith('sb-') || key.startsWith('supabase'))) {
            keysToRemove.push(key);
          }
        }
        keysToRemove.forEach(function(k) { localStorage.removeItem(k); });
        sessionStorage.clear();
        window.location.reload();
      }
      
      function checkError(msg) {
        const m = (msg || '').toLowerCase();
        return m.includes('refresh token') || m.includes('refresh_token');
      }

      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason) {
          const msg = event.reason.message || String(event.reason);
          if (checkError(msg)) {
            event.preventDefault();
            clearSupabaseAndReload(event.reason);
            return;
          }
          if (event.reason.message === 'WebSocket closed without opened.' ||
            (typeof event.reason === 'string' && event.reason.includes('WebSocket closed without opened'))
          ) {
            event.preventDefault();
          }
        }
      });

      window.addEventListener('error', function(event) {
        const e = event.error || event.message;
        if (e && checkError(String(e))) {
          event.preventDefault();
          clearSupabaseAndReload(e);
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
